<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GUPT BHARATVARSH AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #172033 0%, #080b12 45%, #030509 100%);
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: min(1100px, 94%);
      margin: auto;
      padding: 30px 0 60px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #aab4c5;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(17, 24, 39, 0.88);
      border: 1px solid #263247;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 15px 45px rgba(0,0,0,.25);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #344158;
      background: #0b111d;
      color: white;
      border-radius: 10px;
      padding: 13px;
      outline: none;
      margin-bottom: 18px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .option {
      background: #101827;
      border: 1px solid #344158;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
    }

    .option input {
      width: auto;
      margin: 0 6px 0 0;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #ff7a00;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    button:hover {
      opacity: .9;
    }

    button.secondary {
      background: #273449;
    }

    button.green {
      background: #087f5b;
    }

    .status {
      background: #0b111d;
      border: 1px solid #29364b;
      border-radius: 10px;
      padding: 13px;
      color: #b9c5d8;
      margin-top: 15px;
      white-space: pre-wrap;
    }

    .scene {
      border: 1px solid #29364b;
      background: #0a101b;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .scene-title {
      font-weight: bold;
      color: #ff9b42;
      margin-bottom: 8px;
    }

    .prompt {
      color: #b8c3d6;
      line-height: 1.5;
      font-size: 14px;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    video {
      width: 100%;
      border-radius: 14px;
      background: black;
      margin-top: 15px;
    }

    .hidden {
      display: none;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      background: #172235;
      border-radius: 8px;
      color: #aebbd0;
      font-size: 12px;
      margin-right: 5px;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>GUPT BHARATVARSH AI</h1>

  <div class="subtitle">
    AI Documentary Script → Scenes → Voice → Video
  </div>

  <!-- PROJECT -->
  <div class="card">

    <h2>🎬 Documentary Project</h2>

    <label>Documentary Title</label>

    <input
      id="title"
      type="text"
      value="कैलाश मंदिर का रहस्य"
    />

    <label>Documentary Script</label>

    <textarea id="script">महाराष्ट्र की एलोरा गुफाओं में मौजूद कैलाश मंदिर को देखकर आज भी लोग हैरान रह जाते हैं।

क्योंकि यह मंदिर किसी पत्थर को जोड़कर नहीं बनाया गया था।

बल्कि एक विशाल पहाड़ को ऊपर से नीचे तक काटकर इसे बनाया गया था।

इतिहासकारों के अनुसार इस विशाल मंदिर को बनाने में लाखों टन चट्टान हटाई गई होगी।

सबसे रहस्यमयी बात यह है कि मंदिर की पूरी संरचना एक ही चट्टान से बनाई गई है।

आज भी यह सवाल रहस्य बना हुआ है कि इतने बड़े पत्थर के पहाड़ को उस समय के कारीगरों ने इतनी सटीकता से कैसे काटा।

कैलाश मंदिर सिर्फ एक मंदिर नहीं बल्कि प्राचीन भारतीय वास्तुकला की एक अद्भुत मिसाल है।

इसकी विशाल मूर्तियां, स्तंभ और बारीक नक्काशी आज भी लोगों को चौंका देती है।

लेकिन इसके निर्माण की पूरी तकनीक आज भी इतिहास के सबसे बड़े रहस्यों में से एक है।

क्या प्राचीन भारत के कारीगरों के पास ऐसी तकनीक थी जिसे हम आज पूरी तरह समझ नहीं पाए हैं?

यही सवाल कैलाश मंदिर को भारत के सबसे रहस्यमयी ऐतिहासिक स्थलों में शामिल करता है।</textarea>

    <div class="grid">

      <div>
        <label>Voice</label>

        <select id="voice">
          <option value="JBFqnCBsd6RMkjVDRZzb">
            George — Natural Documentary
          </option>

          <option value="CwhRBWXzGAHq8TQ4Fs17">
            Roger — Deep Documentary
          </option>
        </select>
      </div>

      <div>
        <label>Visual Style</label>

        <select id="visualStyle">
          <option value="mystery">Cinematic Mystery</option>
          <option value="history">Historical Documentary</option>
          <option value="dark">Dark Mystery</option>
          <option value="nature">Nature Documentary</option>
        </select>
      </div>

    </div>

    <label>Scene Duration</label>

    <div class="options">

      <label class="option">
        <input
          type="radio"
          name="sceneDuration"
          value="5"
          checked
        />
        5 sec
      </label>

      <label class="option">
        <input
          type="radio"
          name="sceneDuration"
          value="7"
        />
        7 sec
      </label>

      <label class="option">
        <input
          type="radio"
          name="sceneDuration"
          value="9"
        />
        9 sec
      </label>

      <label class="option">
        <input
          type="radio"
          name="sceneDuration"
          value="12"
        />
        12 sec
      </label>

    </div>

    <label>Total Video Length</label>

    <div class="options">

      <label class="option">
        <input
          type="radio"
          name="totalDuration"
          value="60"
          checked
        />
        1 Minute
      </label>

      <label class="option">
        <input
          type="radio"
          name="totalDuration"
          value="300"
        />
        5 Minutes
      </label>

      <label class="option">
        <input
          type="radio"
          name="totalDuration"
          value="600"
        />
        10 Minutes
      </label>

      <label class="option">
        <input
          type="radio"
          name="totalDuration"
          value="900"
        />
        15 Minutes
      </label>

    </div>

    <label>Video Type</label>

    <div class="options">

      <label class="option">
        <input
          type="radio"
          name="videoType"
          value="normal"
          checked
        />
        🎥 Normal Cinematic
      </label>

      <label class="option">
        <input
          type="radio"
          name="videoType"
          value="2d"
        />
        🎨 2D Animation
      </label>

    </div>

    <button id="generateBtn">
      🚀 Generate Documentary
    </button>

    <div id="mainStatus" class="status">
      Ready
    </div>

  </div>


  <!-- SCENES -->

  <div class="card">

    <h2>🎞️ Scenes</h2>

    <div id="sceneInfo"></div>

    <div id="scenes"></div>

  </div>


  <!-- VOICE -->

  <div class="card">

    <h2>🎙️ ElevenLabs AI Voice</h2>

    <button
      id="voiceBtn"
      class="secondary"
    >
      🎙️ Generate AI Voice
    </button>

    <div id="voiceStatus" class="status">
      Voice not generated
    </div>

    <audio
      id="audioPlayer"
      controls
      class="hidden"
    ></audio>

  </div>


  <!-- VIDEO -->

  <div class="card">

    <h2>🎬 Final Video</h2>

    <div id="videoInfo">

      <span class="badge">
        AI Video Pipeline
      </span>

      <span class="badge">
        Normal / 2D
      </span>

      <span class="badge">
        5 / 7 / 9 / 12 sec
      </span>

    </div>

    <button
      id="videoBtn"
      class="green"
    >
      🎬 Create Final Video
    </button>

    <div id="videoStatus" class="status">
      Video not generated
    </div>

    <video
      id="finalVideo"
      controls
      class="hidden"
    ></video>

  </div>

</div>


<script>

  let generatedScenes = [];
  let voiceBlob = null;
  let videoScenes = [];

  const $ = (id) =>
    document.getElementById(id);


  function getRadio(name) {

    const element =
      document.querySelector(
        `input[name="${name}"]:checked`
      );

    return element
      ? element.value
      : null;
  }


  function splitScript(text) {

    return text
      .replace(/\r/g, "")
      .split(/(?<=[।!?])\s+|\n+/)
      .map(x => x.trim())
      .filter(Boolean);

  }


  function getStylePrompt(style) {

    const styles = {

      mystery:
        "mysterious ancient Indian location, dramatic fog, cinematic lighting, dark atmospheric mood, ultra realistic",

      history:
        "ancient Indian architecture, historical atmosphere, cinematic documentary lighting, realistic details",

      dark:
        "dark mysterious ancient Indian location, deep shadows, dramatic cinematic lighting, ultra realistic",

      nature:
        "ancient Indian monument surrounded by natural landscape, cinematic sunlight, realistic environment"

    };

    return styles[style] || styles.mystery;

  }


  function createScenes() {

    const script =
      $("script").value.trim();

    const sceneDuration =
      Number(getRadio("sceneDuration"));

    const totalDuration =
      Number(getRadio("totalDuration"));

    const visualStyle =
      $("visualStyle").value;

    const videoType =
      getRadio("videoType");

    if (!script) {

      throw new Error(
        "Documentary script खाली है."
      );

    }


    const sentences =
      splitScript(script);


    const requiredScenes =
      Math.ceil(
        totalDuration / sceneDuration
      );


    generatedScenes = [];


    for (
      let i = 0;
      i < requiredScenes;
      i++
    ) {

      const narration =
        sentences[i % sentences.length];


      let prompt;


      if (videoType === "2d") {

        prompt =
          `High quality 2D animated documentary scene, ` +
          `Indian historical storytelling, detailed characters, ` +
          `detailed environment, smooth animation, cinematic composition, ` +
          `dramatic lighting, rich colors, professional animation, ` +
          `16:9, no text, no watermark. ` +
          `${narration}`;

      } else {

        prompt =
          `${getStylePrompt(visualStyle)}, ` +
          `professional documentary cinematography, ` +
          `realistic camera movement, atmospheric depth, ` +
          `high detail, cinematic composition, ` +
          `16:9, no text, no watermark. ` +
          `${narration}`;

      }


      generatedScenes.push({

        id: i + 1,

        narration,

        prompt,

        duration: sceneDuration,

        type: videoType

      });

    }


    renderScenes();

    return generatedScenes;

  }


  function renderScenes() {

    const container =
      $("scenes");

    container.innerHTML = "";


    $("sceneInfo").innerHTML =
      `<span class="badge">
        ${generatedScenes.length} Scenes
      </span>
      <span class="badge">
        ${generatedScenes[0]?.duration || 0} sec each
      </span>
      <span class="badge">
        ${generatedScenes[0]?.type === "2d"
          ? "2D Animation"
          : "Normal Cinematic"}
      </span>`;


    generatedScenes.forEach(scene => {

      const div =
        document.createElement("div");

      div.className = "scene";


      div.innerHTML = `

        <div class="scene-title">
          Scene ${scene.id}
        </div>

        <div>
          <strong>Narration:</strong>
          ${escapeHtml(scene.narration)}
        </div>

        <br>

        <div class="prompt">
          <strong>Visual Prompt:</strong><br>
          ${escapeHtml(scene.prompt)}
        </div>

      `;


      container.appendChild(div);

    });

  }


  function escapeHtml(text) {

    return String(text)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  async function generateVoice() {

    if (!generatedScenes.length) {

      createScenes();

    }


    const voiceId =
      $("voice").value;


    const fullText =
      generatedScenes
        .map(scene => scene.narration)
        .join(" ");


    if (!fullText) {

      throw new Error(
        "Voice के लिए narration नहीं मिला."
      );

    }


    $("voiceStatus").textContent =
      "🎙️ ElevenLabs voice generate हो रही है...";


    const response =
      await fetch(
        "/api/generate-voice",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            text: fullText,

            voiceId

          })

        }
      );


    if (!response.ok) {

      let errorText =
        await response.text();

      throw new Error(
        errorText ||
        `Voice error: HTTP ${response.status}`
      );

    }


    voiceBlob =
      await response.blob();


    const audioUrl =
      URL.createObjectURL(
        voiceBlob
      );


    const player =
      $("audioPlayer");


    player.src =
      audioUrl;


    player.classList.remove(
      "hidden"
    );


    $("voiceStatus").textContent =
      "✅ AI Voice तैयार है.";

  }


  async function prepareVideo() {

    if (!generatedScenes.length) {

      createScenes();

    }


    const sceneDuration =
      Number(
        getRadio("sceneDuration")
      );


    const videoType =
      getRadio("videoType");


    $("videoStatus").textContent =
      "🎬 Video scenes prepare हो रहे हैं...";


    const response =
      await fetch(
        "/api/generate-video",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            scenes:
              generatedScenes,

            duration:
              sceneDuration,

            style:
              videoType

          })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data?.error ||
        data?.message ||
        "Video generation error"
      );

    }


    videoScenes =
      data.scenes || [];


    $("videoStatus").textContent =
      `✅ ${videoScenes.length} video scenes तैयार हैं.\n\n` +
      `Mode: ${
        videoType === "2d"
          ? "2D Animation"
          : "Normal Cinematic"
      }\n` +
      `Scene Duration: ${sceneDuration} sec\n\n` +
      `Video rendering backend के लिए scenes तैयार हैं.`;

  }


  async function generateDocumentary() {

    try {

      $("mainStatus").textContent =
        "⏳ Documentary scenes generate हो रहे हैं...";


      createScenes();


      $("mainStatus").textContent =
        `✅ ${generatedScenes.length} scenes तैयार हैं.\n` +
        `अब Voice और Video generate कर सकते हैं.`;

    } catch (error) {

      $("mainStatus").textContent =
        "❌ " +
        (error?.message ||
        String(error));

    }

  }


  $("generateBtn")
    .addEventListener(
      "click",
      generateDocumentary
    );


  $("voiceBtn")
    .addEventListener(
      "click",
      async () => {

        try {

          $("voiceBtn").disabled =
            true;

          await generateVoice();

        } catch (error) {

          $("voiceStatus").textContent =
            "❌ " +
            (error?.message ||
            String(error));

        } finally {

          $("voiceBtn").disabled =
            false;

        }

      }
    );


  $("videoBtn")
    .addEventListener(
      "click",
      async () => {

        try {

          $("videoBtn").disabled =
            true;

          await prepareVideo();

        } catch (error) {

          $("videoStatus").textContent =
            "❌ " +
            (error?.message ||
            String(error));

        } finally {

          $("videoBtn").disabled =
            false;

        }

      }
    );


  /*
    Automatic initial scene generation
  */

  try {

    createScenes();

  } catch (error) {

    console.log(
      "Initial scene generation skipped:",
      error
    );

  }

</script>

</body>
</html>
