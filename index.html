<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gupt Bharatvarsh AI</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial,sans-serif;
}

.container{
  max-width:750px;
  margin:auto;
}

h1{
  text-align:center;
  color:#ffb000;
}

.box{
  background:#1d1d1d;
  padding:18px;
  border-radius:12px;
  margin-top:18px;
}

textarea{
  width:100%;
  height:180px;
  padding:15px;
  box-sizing:border-box;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:12px;
  background:#ff9800;
  color:#111;
  border:0;
  border-radius:10px;
  font-size:17px;
  font-weight:bold;
}

.secondary{
  background:#444;
  color:white;
}

.scene{
  background:#151515;
  padding:15px;
  margin-top:15px;
  border-radius:10px;
  border-left:4px solid #ff9800;
}

.prompt{
  background:#222;
  padding:12px;
  border-radius:8px;
  margin-top:10px;
  line-height:1.5;
}

.copy{
  background:#555;
  color:white;
  font-size:15px;
}

.small{
  color:#aaa;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 GUPT BHARATVARSH AI</h1>

<div class="box">

<h2>📝 Story to Video Scenes</h2>

<p class="small">
अपनी पूरी कहानी यहाँ लिखें।
</p>

<textarea id="story"
placeholder="उदाहरण: बरमूडा ट्रायंगल में एक पुराना जहाज समुद्र के बीच यात्रा कर रहा था..."></textarea>

<button id="generate">
🎬 Generate Scenes
</button>

<button id="newProject" class="secondary">
🔄 New Project
</button>

</div>

<div id="result"></div>

</div>

<script>

const storyBox = document.getElementById("story");
const result = document.getElementById("result");
const generateButton = document.getElementById("generate");
const newProjectButton = document.getElementById("newProject");

function makePrompt(sentence,index){

return `Cinematic documentary scene for a Hindi mystery documentary.

Scene ${index+1}:

${sentence}

Visual style:
ultra realistic cinematic documentary,
dramatic atmosphere,
realistic environment,
detailed characters and objects,
natural lighting,
volumetric light,
film look,
high detail,
16:9 widescreen,
8K quality,
no text,
no subtitles,
no watermark.`;

}

generateButton.addEventListener("click",function(){

let story = storyBox.value.trim();

if(story === ""){
alert("पहले अपनी कहानी लिखें!");
return;
}

let sentences = story
.split(/[।.!?]+/)
.map(x => x.trim())
.filter(x => x !== "");

if(sentences.length === 0){
alert("कहानी सही तरीके से लिखें।");
return;
}

result.innerHTML =
'<div class="box"><h2>🎥 Generated Scenes</h2></div>';

sentences.forEach(function(sentence,index){

let prompt = makePrompt(sentence,index);

let scene = document.createElement("div");

scene.className = "scene";

scene.innerHTML = `
<h3>🎬 Scene ${index+1}</h3>

<p>${sentence}</p>

<h4>🖼️ AI Image Prompt</h4>

<div class="prompt" id="prompt-${index}">
${prompt}
</div>

<button class="copy" onclick="copyPrompt(${index})">
📋 Copy Prompt
</button>
`;

result.appendChild(scene);

});

});

function copyPrompt(index){

let text =
document.getElementById("prompt-"+index).innerText;

navigator.clipboard.writeText(text)
.then(function(){

alert("✅ Prompt copied!");

})
.catch(function(){

alert("Prompt copy नहीं हुआ। Text को manually copy करें।");

});

}

newProjectButton.addEventListener("click",function(){

storyBox.value = "";

result.innerHTML = "";

window.scrollTo({
top:0,
behavior:"smooth"
});

});

</script>

</body>
</html>
