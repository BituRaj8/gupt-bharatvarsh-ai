

<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My AI Video Maker</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111;
  color:white;
  padding:20px;
}

h1{
  text-align:center;
}

textarea{
  width:100%;
  height:180px;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:10px;
  padding:12px;
  box-sizing:border-box;
  font-size:16px;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#6c5ce7;
  color:white;
  font-size:18px;
}

#result{
  margin-top:20px;
  background:#222;
  padding:15px;
  border-radius:10px;
  min-height:100px;
}
</style>
</head>

<body>

<h1>🎬 My AI Video Maker</h1>

<textarea id="story" placeholder="अपनी कहानी यहाँ लिखें..."></textarea>

<button onclick="generate()">Generate Video</button>

<div id="result">
  आपकी वीडियो यहाँ तैयार होगी...
</div>

<script>
function generate(){

  let story = document.getElementById("story").value;

  if(story.trim()==""){
    alert("पहले कहानी लिखें");
    return;
  }

  document.getElementById("result").innerHTML =
  "<h2>🎬 Video Project Ready</h2>" +
  "<p>आपकी कहानी सफलतापूर्वक तैयार है।</p>" +
  "<p>अगले चरण में इसमें AI Images, Voice और Video Generation जोड़ा जाएगा।</p>";
}
</script>

</body>
</html>
