<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GUPT BHARATVARSH AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
margin-bottom:25px;
}

.box{
background:#1b1b1b;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

textarea,
input,
select{
width:100%;
padding:14px;
font-size:16px;
border:0;
border-radius:10px;
margin:8px 0 15px;
}

textarea{
height:220px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:0;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

#generateButton{
background:#457b9d;
color:white;
}

#connectPollinations{
background:#ffb703;
color:#111;
}

.generateImageButton{
background:#06d6a0;
color:#111;
}

.downloadImageButton{
background:#2a9d8f;
color:white;
}

#saveKeyButton{
background:#f4a261;
color:#111;
}

#loadVoices{
background:#8338ec;
color:white;
}

#voiceButton{
background:#e63946;
color:white;
}

#downloadButton{
background:#2a9d8f;
color:white;
}

#removeKeyButton{
background:#555;
color:white;
}

.scene{
background:#222;
padding:15px;
margin:12px 0;
border-radius:10px;
border-left:4px solid #457b9d;
}

.sceneTitle{
color:#ffd166;
font-weight:bold;
font-size:18px;
}

.sceneText{
margin-top:10px;
line-height:1.6;
}

.prompt{
margin-top:12px;
padding:12px;
background:#181818;
border-radius:8px;
color:#bbb;
line-height:1.5;
font-size:14px;
}

.sceneImage{
width:100%;
margin-top:15px;
border-radius:10px;
display:block;
}

#status,
#pollinationsStatus{
background:#222;
padding:12px;
border-radius:8px;
text-align:center;
margin-top:15px;
}

.note{
color:#999;
font-size:13px;
line-height:1.5;
}

.saved{
color:#90be6d;
font-size:13px;
margin-bottom:10px;
}

audio{
width:100%;
margin-top:15px;
}

</style>
</head>

<body>

<h1>🎬 GUPT BHARATVARSH AI</h1>


<!-- STORY -->

<div class="box">

<h2>📝 अपनी Story डालें</h2>

<textarea
id="story"
placeholder="अपनी Hindi documentary story यहाँ लिखें..."
></textarea>

<label>🎬 Number of Scenes</label>

<input
id="sceneCount"
type="number"
min="1"
max="50"
value="10"
>

<button id="generateButton">
🎬 Generate Scenes
</button>

<div id="scenes"></div>

</div>


<!-- POLLINATIONS -->

<div class="box">

<h2>🖼️ Pollinations AI Image</h2>

<button id="connectPollinations">
🔐 Connect Pollinations
</button>

<div id="pollinationsStatus">
🟡 पहले Pollinations Connect करें
</div>

<p class="note">
Connect करने के बाद हर Scene की AI Image बनाई जा सकती है।
</p>

</div>


<!-- ELEVENLABS -->

<div class="box">

<h2>🎙️ ElevenLabs Hindi Voice</h2>

<input
id="apiKey"
type="password"
placeholder="ElevenLabs API Key यहाँ डालें"
>

<div id="keyStatus" class="saved"></div>

<button id="saveKeyButton">
💾 Save API Key
</button>

<button id="removeKeyButton">
🗑️ Remove Saved API Key
</button>

<button id="loadVoices">
🔄 Load ElevenLabs Voices
</button>

<select id="voiceSelect">

<option value="">
पहले Voices Load करें
</option>

</select>

<select id="modelSelect">

<option value="eleven_multilingual_v2">
Multilingual v2 - Natural Hindi
</option>

<option value="eleven_v3">
Eleven v3 - Expressive
</option>

</select>

<label>🎚️ Voice Speed</label>

<input
id="speed"
type="range"
min="0.7"
max="1.2"
step="0.05"
value="0.95"
>

<div id="speedValue">
Speed: 0.95
</div>

<button id="voiceButton">
🎙️ Generate Professional Hindi Voice
</button>

<audio
id="audio"
controls
></audio>

<button
id="downloadButton"
disabled
>
💾 Download MP3
</button>

<div id="status">
🟡 Story डालें और शुरू करें
</div>

<p class="note">
Testing version.
</p>

</div>


<script>

/* =====================================================
ELEMENTS
===================================================== */

const story =
document.getElementById("story");

const sceneCount =
document.getElementById("sceneCount");

const generateButton =
document.getElementById("generateButton");

const scenes =
document.getElementById("scenes");

const apiKey =
document.getElementById("apiKey");

const saveKeyButton =
document.getElementById("saveKeyButton");

const removeKeyButton =
document.getElementById("removeKeyButton");

const loadVoices =
document.getElementById("loadVoices");

const voiceSelect =
document.getElementById("voiceSelect");

const voiceButton =
document.getElementById("voiceButton");

const downloadButton =
document.getElementById("downloadButton");

const audio =
document.getElementById("audio");

const status =
document.getElementById("status");

const speed =
document.getElementById("speed");

const speedValue =
document.getElementById("speedValue");

let audioBlob = null;


/* =====================================================
POLLINATIONS APP KEY
===================================================== */

/*
अपनी Pollinations pk_ App Key यहाँ डालें।

उदाहरण:
const POLLINATIONS_CLIENT_ID = "pk_bxT7t04xyyGHLQhN";

अपनी पूरी key चैट में शेयर न करें।
*/

const POLLINATIONS_CLIENT_ID =
"YOUR_POLLINATIONS_APP_KEY";


let pollinationsToken =
sessionStorage.getItem(
"gb_pollinations_token"
);

const connectPollinations =
document.getElementById(
"connectPollinations"
);

const pollinationsStatus =
document.getElementById(
"pollinationsStatus"
);


/* =====================================================
LOAD ELEVENLABS KEY
===================================================== */

const savedKey =
localStorage.getItem(
"gb_eleven_api_key"
);

if(savedKey){

apiKey.value =
savedKey;

document.getElementById(
"keyStatus"
).textContent =
"✅ API Key saved है।";

}


/* =====================================================
LOAD SAVED VOICES
===================================================== */

const savedVoices =
localStorage.getItem(
"gb_eleven_voices"
);

if(savedVoices){

try{

const voices =
JSON.parse(savedVoices);

voiceSelect.innerHTML = "";

voices.forEach(
function(voice){

const option =
document.createElement("option");

option.value =
voice.voice_id;

option.textContent =
voice.name;

voiceSelect.appendChild(
option
);

});

const savedVoice =
localStorage.getItem(
"gb_selected_voice"
);

if(savedVoice){

voiceSelect.value =
savedVoice;

}

}
catch(error){

console.error(error);

}

}


/* =====================================================
GENERATE SCENES
===================================================== */

generateButton.addEventListener(
"click",
function(){

const text =
story.value.trim();

const count =
Number(sceneCount.value);

if(text === ""){

alert(
"पहले Story लिखें।"
);

return;

}

if(count < 1 || count > 50){

alert(
"Scenes की संख्या 1 से 50 के बीच रखें।"
);

return;

}

scenes.innerHTML = "";

const words =
text
.split(/\s+/)
.filter(Boolean);

const wordsPerScene =
Math.ceil(
words.length / count
);

let sceneNumber = 0;

for(
let i=0;
i<count;
i++
){

const start =
i * wordsPerScene;

const end =
Math.min(
start + wordsPerScene,
words.length
);

const sceneText =
words
.slice(start,end)
.join(" ");

if(sceneText === ""){
continue;
}

sceneNumber++;

const prompt =
"Cinematic documentary scene, " +
sceneText +
", ultra realistic, dramatic lighting, realistic environment, cinematic composition, high detail, 16:9, 8K, no text, no watermark";

const scene =
document.createElement("div");

scene.className =
"scene";

scene.innerHTML =

"<div class='sceneTitle'>" +
"🎬 Scene " +
sceneNumber +
"</div>" +

"<div class='sceneText'>" +
sceneText +
"</div>" +

"<div class='prompt'>" +
"<b>🖼️ AI Image Prompt:</b><br>" +
prompt +
"</div>" +

"<button class='generateImageButton'>" +
"🎨 Generate Scene Image" +
"</button>" +

"<div class='imageContainer'></div>";

scenes.appendChild(scene);

const imageButton =
scene.querySelector(
".generateImageButton"
);

const imageContainer =
scene.querySelector(
".imageContainer"
);

imageButton.addEventListener(
"click",
function(){

generateSceneImage(
prompt,
imageButton,
imageContainer
);

});

}

status.textContent =
"✅ " +
sceneNumber +
" Scenes तैयार हो गए।";

});


/* =====================================================
PKCE
===================================================== */

function randomString(length){

const chars =
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";

let result = "";

const array =
new Uint8Array(length);

crypto.getRandomValues(array);

array.forEach(
function(value){

result +=
chars[value % chars.length];

});

return result;

}


function base64UrlEncode(bytes){

let binary = "";

bytes.forEach(
function(byte){

binary +=
String.fromCharCode(byte);

});

return btoa(binary)
.replace(/\+/g,"-")
.replace(/\//g,"_")
.replace(/=+$/,"");

}


async function createChallenge(
verifier
){

const data =
new TextEncoder().encode(
verifier
);

const hash =
await crypto.subtle.digest(
"SHA-256",
data
);

return base64UrlEncode(
new Uint8Array(hash)
);

}


/* =====================================================
CONNECT POLLINATIONS
===================================================== */

connectPollinations.addEventListener(
"click",
async function(){

if(
!POLLINATIONS_CLIENT_ID ||
POLLINATIONS_CLIENT_ID ===
"YOUR_POLLINATIONS_APP_KEY"
){

alert(
"पहले code में Pollinations pk_ App Key डालें।"
);

return;

}

try{

connectPollinations.disabled =
true;

pollinationsStatus.textContent =
"⏳ Pollinations Connect हो रहा है...";

const verifier =
randomString(64);

const challenge =
await createChallenge(
verifier
);

const state =
randomString(32);

sessionStorage.setItem(
"gb_pollinations_verifier",
verifier
);

sessionStorage.setItem(
"gb_pollinations_state",
state
);

const redirectUri =
window.location.origin +
window.location.pathname;

const params =
new URLSearchParams({

response_type:"code",

client_id:
POLLINATIONS_CLIENT_ID,

redirect_uri:
redirectUri,

scope:"usage",

state:state,

code_challenge:
challenge,

code_challenge_method:"S256"

});

window.location.href =
"https://enter.pollinations.ai/authorize?" +
params.toString();

}
catch(error){

console.error(error);

pollinationsStatus.textContent =
"❌ Pollinations Connect नहीं हुआ।";

connectPollinations.disabled =
false;

}

});


/* =====================================================
POLLINATIONS CALLBACK
===================================================== */

async function handlePollinationsCallback(){

const currentURL =
new URL(
window.location.href
);

const code =
currentURL.searchParams.get(
"code"
);

const returnedState =
currentURL.searchParams.get(
"state"
);

if(!code){

if(pollinationsToken){

pollinationsStatus.textContent =
"✅ Pollinations Connected है।";

connectPollinations.textContent =
"✅ Pollinations Connected";

}

return;

}

const savedState =
sessionStorage.getItem(
"gb_pollinations_state"
);

const verifier =
sessionStorage.getItem(
"gb_pollinations_verifier"
);

if(
!savedState ||
!verifier ||
returnedState !== savedState
){

pollinationsStatus.textContent =
"❌ Authorization check failed।";

return;

}

try{

pollinationsStatus.textContent =
"⏳ Authorization complete हो रही है...";

const redirectUri =
window.location.origin +
window.location.pathname;

const response =
await fetch(
"https://enter.pollinations.ai/api/oauth/token",
{

method:"POST",

headers:{
"Content-Type":
"application/x-www-form-urlencoded"
},

body:
new URLSearchParams({

grant_type:
"authorization_code",

code:code,

client_id:
POLLINATIONS_CLIENT_ID,

redirect_uri:
redirectUri,

code_verifier:
verifier

})

});

const data =
await response.json();

if(
!response.ok ||
!data.access_token
){

console.error(data);

throw new Error(
"Pollinations token नहीं मिला"
);

}

pollinationsToken =
data.access_token;

sessionStorage.setItem(
"gb_pollinations_token",
pollinationsToken
);

sessionStorage.removeItem(
"gb_pollinations_verifier"
);

sessionStorage.removeItem(
"gb_pollinations_state"
);

window.history.replaceState(
{},
document.title,
redirectUri
);

pollinationsStatus.textContent =
"✅ Pollinations Connected है।";

connectPollinations.textContent =
"✅ Pollinations Connected";

}
catch(error){

console.error(error);

pollinationsStatus.textContent =
"❌ Pollinations authorization failed।";

}

}


/* =====================================================
GENERATE SCENE IMAGE
===================================================== */

async function generateSceneImage(
prompt,
button,
container
){

if(!pollinationsToken){

alert(
"पहले 🔐 Connect Pollinations दबाएँ।"
);

return;

}

try{

button.disabled =
true;

button.textContent =
"⏳ Image बन रही है...";

pollinationsStatus.textContent =
"⏳ AI Image generate हो रही है...";

const imageURL =
"https://gen.pollinations.ai/image/" +
encodeURIComponent(prompt) +
"?model=flux" +
"&width=1280" +
"&height=720";

const response =
await fetch(
imageURL,
{

method:"GET",

headers:{
"Authorization":
"Bearer " +
pollinationsToken
}

}
);

if(!response.ok){

const errorText =
await response.text();

console.error(errorText);

throw new Error(
"Image generation failed"
);

}

const blob =
await response.blob();

const localURL =
URL.createObjectURL(blob);

container.innerHTML = "";

const image =
document.createElement("img");

image.className =
"sceneImage";

image.src =
localURL;

image.alt =
"AI Generated Scene";

container.appendChild(image);

const download =
document.createElement("button");

download.className =
"downloadImageButton";

download.textContent =
"💾 Download Image";

download.addEventListener(
"click",
function(){

const link =
document.createElement("a");

link.href =
localURL;

link.download =
"gupt-bharatvarsh-scene.png";

document.body.appendChild(
link
);

link.click();

link.remove();

});

container.appendChild(download);

button.textContent =
"✅ Image तैयार है";

pollinationsStatus.textContent =
"✅ AI Image तैयार है।";

}
catch(error){

console.error(error);

button.textContent =
"❌ फिर से Generate करें";

pollinationsStatus.textContent =
"❌ Image generate नहीं हुई।";

alert(
"Image generate नहीं हुई। Pollinations connection check करें।"
);

}
finally{

button.disabled =
false;

}

}


/* =====================================================
SAVE ELEVENLABS API KEY
===================================================== */

saveKeyButton.addEventListener(
"click",
function(){

const key =
apiKey.value.trim();

if(!key){

alert(
"पहले API Key डालें।"
);

return;

}

localStorage.setItem(
"gb_eleven_api_key",
key
);

document.getElementById(
"keyStatus"
).textContent =
"✅ API Key save हो गई।";

status.textContent =
"✅ API Key saved है।";

});


/* =====================================================
REMOVE ELEVENLABS KEY
===================================================== */

removeKeyButton.addEventListener(
"click",
function(){

localStorage.removeItem(
"gb_eleven_api_key"
);

apiKey.value = "";

document.getElementById(
"keyStatus"
).textContent =
"🗑️ API Key हटा दी गई।";

status.textContent =
"🟡 API Key हट गई।";

});


/* =====================================================
LOAD ELEVENLABS VOICES
===================================================== */

loadVoices.addEventListener(
"click",
async function(){

const key =
apiKey.value.trim();

if(!key){

alert(
"पहले ElevenLabs API Key डालें।"
);

return;

}

try{

loadVoices.disabled =
true;

status.textContent =
"⏳ Voices load हो रही हैं...";

const response =
await fetch(
"https://api.elevenlabs.io/v1/voices",
{

method:"GET",

headers:{
"xi-api-key":key
}

});

if(!response.ok){

const errorText =
await response.text();

console.error(errorText);

throw new Error(
"Voices load नहीं हुईं"
);

}

const data =
await response.json();

localStorage.setItem(
"gb_eleven_api_key",
key
);

localStorage.setItem(
"gb_eleven_voices",
JSON.stringify(
data.voices
)
);

voiceSelect.innerHTML = "";

data.voices.forEach(
function(voice){

const option =
document.createElement(
"option"
);

option.value =
voice.voice_id;

option.textContent =
voice.name;

voiceSelect.appendChild(
option
);

});

const savedVoice =
localStorage.getItem(
"gb_selected_voice"
);

if(
savedVoice &&
data.voices.some(
v =>
v.voice_id === savedVoice
)
){

voiceSelect.value =
savedVoice;

}
else if(
data.voices.length
){

voiceSelect.value =
data.voices[0].voice_id;

localStorage.setItem(
"gb_selected_voice",
data.voices[0].voice_id
);

}

document.getElementById(
"keyStatus"
).textContent =
"✅ API Key और Voices saved हैं।";

status.textContent =
"✅ Voices successfully load हो गईं।";

}
catch(error){

console.error(error);

status.textContent =
"❌ Voices load नहीं हुईं।";

alert(
"API Key या ElevenLabs account check करें।"
);

}
finally{

loadVoices.disabled =
false;

}

});


/* =====================================================
SAVE VOICE
===================================================== */

voiceSelect.addEventListener(
"change",
function(){

if(voiceSelect.value){

localStorage.setItem(
"gb_selected_voice",
voiceSelect.value
);

}

});


/* =====================================================
SPEED
===================================================== */

speed.addEventListener(
"input",
function(){

speedValue.textContent =
"Speed: " +
speed.value;

});


/* =====================================================
GENERATE VOICE
===================================================== */

voiceButton.addEventListener(
"click",
async function(){

const key =
apiKey.value.trim();

const text =
story.value.trim();

const voiceId =
voiceSelect.value;

const model =
document.getElementById(
"modelSelect"
).value;

const voiceSpeed =
Number(
speed.value
);

if(!key){

alert(
"पहले API Key डालें।"
);

return;

}

if(!text){

alert(
"पहले Story लिखें।"
);

return;

}

if(!voiceId){

alert(
"पहले Voices Load करें।"
);

return;

}

try{

voiceButton.disabled =
true;

downloadButton.disabled =
true;

status.textContent =
"⏳ Hindi voice बन रही है...";

const url =
"https://api.elevenlabs.io/v1/text-to-speech/" +
voiceId +
"?output_format=mp3_44100_128";

const response =
await fetch(
url,
{

method:"POST",

headers:{

"xi-api-key":
key,

"Content-Type":
"application/json"

},

body:
JSON.stringify({

text:text,

model_id:
model,

voice_settings:{

stability:
0.45,

similarity_boost:
0.80,

style:
0.25,

use_speaker_boost:
true

},

speed:
voiceSpeed

})

});

if(!response.ok){

const errorText =
await response.text();

console.error(
"ElevenLabs Error:",
errorText
);

throw new Error(
errorText
);

}

audioBlob =
await response.blob();

const audioURL =
URL.createObjectURL(
audioBlob
);

audio.src =
audioURL;

audio.load();

downloadButton.disabled =
false;

status.textContent =
"✅ Professional Hindi Voice तैयार है!";

}
catch(error){

console.error(error);

status.textContent =
"❌ Voice generate नहीं हुई।";

alert(
"Voice generate नहीं हुई। API Key, Voice और quota check करें।"
);

}
finally{

voiceButton.disabled =
false;

}

});


/* =====================================================
DOWNLOAD MP3
===================================================== */

downloadButton.addEventListener(
"click",
function(){

if(!audioBlob){

return;

}

const url =
URL.createObjectURL(
audioBlob
);

const link =
document.createElement("a");

link.href =
url;

link.download =
"gupt-bharatvarsh-hindi-voice.mp3";

document.body.appendChild(
link
);

link.click();

link.remove();

setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

});


/* =====================================================
START
===================================================== */

handlePollinationsCallback();

</script>

</body>
</html>
