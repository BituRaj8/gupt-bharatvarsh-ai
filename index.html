<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gupt Bharatvarsh AI</title>

<style>
body{
  margin:0;
  padding:20px;
  background:#111;
  color:white;
  font-family:Arial;
}

.container{
  max-width:700px;
  margin:auto;
}

textarea{
  width:100%;
  height:180px;
  padding:15px;
  box-sizing:border-box;
  background:#222;
  color:white;
  border:1px solid #555;
  border-radius:10px;
  font-size:16px;
}

button{
  width:100%;
  padding:16px;
  margin-top:15px;
  background:#ff9800;
  color:#111;
  border:none;
  border-radius:10px;
  font-size:18px;
  font-weight:bold;
}

#result{
  margin-top:20px;
  padding:15px;
  background:#222;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 GUPT BHARATVARSH AI</h1>

<h3>अपनी कहानी लिखें</h3>

<textarea id="story"
placeholder="यहाँ अपनी कहानी लिखें..."></textarea>

<button id="generate">Generate Scenes</button>

<div id="result">
अभी कोई scene नहीं बना है।
</div>

</div>

<script>

document.getElementById("generate").addEventListener("click", function(){

let story = document.getElementById("story").value.trim();

if(story === ""){
alert("पहले कहानी लिखें!");
return;
}

let sentences = story.split(/[।.!?]+/).filter(function(x){
return x.trim() !== "";
});

let html = "<h2>🎥 Scenes</h2>";

sentences.forEach(function(sentence,index){

html += `
<div style="
background:#111;
padding:15px;
margin-top:10px;
border-radius:10px;
">
<h3>Scene ${index+1}</h3>
<p>${sentence.trim()}</p>
<p>🎨 AI Image Prompt: Cinematic documentary scene, ultra realistic, dramatic lighting, 16:9, no text, no watermark.</p>
</div>
`;

});

document.getElementById("result").innerHTML = html;

});

</script>

</body>
</html>
