<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>GUPT BHARATVARSH AI</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 25px;
    }

    textarea,
    input,
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      border-radius: 10px;
      border: none;
      margin-bottom: 12px;
    }

    textarea {
      height: 220px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    #sceneButton {
      background: #457b9d;
      color: white;
    }

    #voiceButton {
      background: #e63946;
      color: white;
    }

    #downloadButton {
      background: #2a9d8f;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }

    .box {
      background: #1b1b1b;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      text-align: center;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .scene {
      background: #222;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
    }

    .scene strong {
      color: #ffd166;
    }

    .note {
      color: #aaa;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<h1>🎬 GUPT BHARATVARSH AI</h1>

<div class="box">

  <h2>📝 Story</h2>

  <textarea
    id="story"
    placeholder="अपनी हिंदी documentary story यहाँ लिखें..."
  ></textarea>

  <button id="sceneButton">
    🎬 Generate Scenes
  </button>

  <div id="scenes"></div>

</div>


<div class="box">

  <h2>🎙️ ElevenLabs Professional Hindi Voice</h2>

  <input
    type="password"
    id="apiKey"
    placeholder="ElevenLabs API Key यहाँ डालें"
  >

  <button id="loadVoices">
    🔄 Load ElevenLabs Voices
  </button>

  <select id="voiceSelect">
    <option value="">पहले Load Voices दबाएँ</option>
  </select>

  <select id="modelSelect">

    <option value="eleven_multilingual_v2">
      Multilingual v2 - Natural Documentary
    </option>

    <option value="eleven_v3">
      Eleven v3 - Expressive Voice
    </option>

  </select>

  <label>
    Voice Speed:
  </label>

  <input
    type="range"
    id="speed"
    min="0.7"
    max="1.2"
    step="0.05"
    value="0.95"
  >

  <div id="speedValue">
    Speed: 0.95
  </div>

  <button id="voiceButton">
    🎙️ Generate Professional Hindi Voice
  </button>

  <audio id="audio" controls></audio>

  <button id="downloadButton" disabled>
    💾 Download MP3
  </button>

  <div id="status">
    🟡 Story डालें और voice generate करें
  </div>

  <p class="note">
    ⚠️ अभी testing के लिए API key browser में डाली जा रही है।
    Public professional version में API key को server पर रखना होगा।
  </p>

</div>


<script>

const story = document.getElementById("story");

const sceneButton =
  document.getElementById("sceneButton");

const scenesBox =
  document.getElementById("scenes");

const apiKey =
  document.getElementById("apiKey");

const loadVoices =
  document.getElementById("loadVoices");

const voiceSelect =
  document.getElementById("voiceSelect");

const voiceButton =
  document.getElementById("voiceButton");

const downloadButton =
  document.getElementById("downloadButton");

const audio =
  document.getElementById("audio");

const status =
  document.getElementById("status");

const speed =
  document.getElementById("speed");

const speedValue =
  document.getElementById("speedValue");

let audioBlob = null;


/* =========================
   SPEED
========================= */

speed.addEventListener("input", function () {

  speedValue.textContent =
    "Speed: " + speed.value;

});


/* =========================
   SCENE GENERATOR
========================= */

sceneButton.addEventListener("click", function () {

  const text =
    story.value.trim();

  if (!text) {

    alert("पहले story लिखें।");
    return;

  }

  scenesBox.innerHTML = "";

  const paragraphs =
    text
      .split(/\n+/)
      .map(x => x.trim())
      .filter(x => x.length > 0);

  if (paragraphs.length === 0) {

    alert("Story नहीं मिली।");
    return;

  }

  paragraphs.forEach(function (paragraph, index) {

    const scene =
      document.createElement("div");

    scene.className = "scene";

    scene.innerHTML =
      "<strong>Scene " +
      (index + 1) +
      "</strong><br><br>" +
      paragraph;

    scenesBox.appendChild(scene);

  });

  status.textContent =
    "✅ " +
    paragraphs.length +
    " scenes तैयार हो गए।";

});


/* =========================
   LOAD ELEVENLABS VOICES
========================= */

loadVoices.addEventListener("click", async function () {

  const key =
    apiKey.value.trim();

  if (!key) {

    alert("पहले ElevenLabs API Key डालें।");
    return;

  }

  try {

    status.textContent =
      "🔄 ElevenLabs voices load हो रही हैं...";

    const response =
      await fetch(
        "https://api.elevenlabs.io/v1/voices",
        {
          method: "GET",

          headers: {
            "xi-api-key": key
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        "API key या ElevenLabs request में समस्या है।"
      );

    }

    const data =
      await response.json();

    voiceSelect.innerHTML = "";

    data.voices.forEach(function (voice) {

      const option =
        document.createElement("option");

      option.value =
        voice.voice_id;

      option.textContent =
        voice.name;

      voiceSelect.appendChild(option);

    });

    status.textContent =
      "✅ ElevenLabs voices load हो गईं।";

  }

  catch (error) {

    console.error(error);

    status.textContent =
      "❌ Voices load नहीं हुईं।";

    alert(
      "API Key check करें और फिर कोशिश करें।"
    );

  }

});


/* =========================
   GENERATE VOICE
========================= */

voiceButton.addEventListener("click", async function () {

  const key =
    apiKey.value.trim();

  const text =
    story.value.trim();

  const voiceId =
    voiceSelect.value;

  const model =
    document.getElementById(
      "modelSelect"
    ).value;

  const voiceSpeed =
    Number(speed.value);


  if (!key) {

    alert("ElevenLabs API Key डालें।");
    return;

  }


  if (!text) {

    alert("पहले story लिखें।");
    return;

  }


  if (!voiceId) {

    alert(
      "पहले Load ElevenLabs Voices दबाकर voice चुनें।"
    );

    return;

  }


  try {

    voiceButton.disabled = true;

    downloadButton.disabled = true;

    status.textContent =
      "⏳ Professional Hindi voice बन रही है...";


    const url =
      "https://api.elevenlabs.io/v1/text-to-speech/"
      + voiceId
      + "?output_format=mp3_44100_128";


    const response =
      await fetch(
        url,
        {
          method: "POST",

          headers: {
            "xi-api-key": key,
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            text: text,

            model_id: model,

            voice_settings: {

              stability: 0.45,

              similarity_boost: 0.80,

              style: 0.25,

              use_speaker_boost: true

            },

            speed: voiceSpeed

          })

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      console.error(errorText);

      throw new Error(
        "ElevenLabs voice generate नहीं हुई।"
      );

    }


    audioBlob =
      await response.blob();


    const audioURL =
      URL.createObjectURL(audioBlob);


    audio.src =
      audioURL;

    audio.load();


    downloadButton.disabled =
      false;

    status.textContent =
      "✅ Professional Hindi voice तैयार है!";


  }

  catch (error) {

    console.error(error);

    status.textContent =
      "❌ Voice generate नहीं हुई।";

    alert(
      "Voice generate नहीं हुई। API key, voice और internet connection check करें।"
    );

  }

  finally {

    voiceButton.disabled =
      false;

  }

});


/* =========================
   DOWNLOAD MP3
========================= */

downloadButton.addEventListener(
  "click",
  function () {

    if (!audioBlob) {

      return;

    }


    const url =
      URL.createObjectURL(audioBlob);


    const a =
      document.createElement("a");


    a.href =
      url;

    a.download =
      "gupt-bharatvarsh-professional-voice.mp3";


    document.body.appendChild(a);

    a.click();

    a.remove();


    setTimeout(function () {

      URL.revokeObjectURL(url);

    }, 1000);

  }
);

</script>

</body>
</html>
