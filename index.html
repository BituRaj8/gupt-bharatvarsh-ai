<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GUPT BHARATVARSH AI</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080808;
  color:white;
}

.header{
  padding:18px;
  text-align:center;
  background:linear-gradient(135deg,#111,#252525);
  border-bottom:1px solid #333;
}

.header h1{
  margin:0;
  font-size:25px;
}

.header p{
  margin:7px 0 0;
  color:#aaa;
}

.container{
  max-width:700px;
  margin:auto;
  padding:18px;
}

.card{
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  padding:18px;
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

textarea{
  width:100%;
  min-height:220px;
  resize:vertical;
  background:#0d0d0d;
  color:white;
  border:1px solid #444;
  border-radius:12px;
  padding:14px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#9b59ff;
}

select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #444;
  background:#0d0d0d;
  color:white;
  font-size:16px;
  margin-bottom:15px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.option{
  background:#101010;
  border:1px solid #333;
  border-radius:12px;
  padding:13px;
}

button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.generate{
  background:linear-gradient(135deg,#8b3dff,#c43dff);
  color:white;
}

.generate:active{
  transform:scale(.98);
}

.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#101010;
  color:#bbb;
  text-align:center;
}

.progress{
  height:8px;
  background:#333;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#8b3dff,#ff3df2);
  transition:.3s;
}

.small{
  color:#888;
  font-size:13px;
  margin-top:8px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#252525;
  color:#bbb;
  font-size:12px;
  margin:3px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🎬 GUPT BHARATVARSH AI</h1>
  <p>AI Documentary Video Maker</p>
</div>

<div class="container">

  <!-- SCRIPT -->
  <div class="card">

    <label>📝 Documentary Script</label>

    <textarea
      id="script"
      placeholder="अपना पूरा हिंदी script यहाँ paste करें..."></textarea>

    <div class="small">
      Script → Scenes → Voice → Video
    </div>

  </div>


  <!-- VOICE -->
  <div class="card">

    <label>🎙️ Voice चुनें</label>

    <select id="voice">

      <option value="roger">
        Roger — Natural / Casual
      </option>

      <option value="male_deep">
        Male — Deep Documentary
      </option>

      <option value="male_natural">
        Male — Natural
      </option>

      <option value="female_doc">
        Female — Documentary
      </option>

      <option value="female_natural">
        Female — Natural
      </option>

      <option value="dramatic">
        Dramatic — Mystery
      </option>

    </select>

    <div>
      <span class="badge">Natural</span>
      <span class="badge">Documentary</span>
      <span class="badge">Deep</span>
      <span class="badge">Female</span>
      <span class="badge">Dramatic</span>
    </div>

  </div>


  <!-- SCENE -->
  <div class="card">

    <label>🎞️ Scene Duration</label>

    <div class="grid">

      <div class="option">
        <input type="radio"
               name="duration"
               value="5">
        5 Seconds
      </div>

      <div class="option">
        <input type="radio"
               name="duration"
               value="7"
               checked>
        7 Seconds
      </div>

      <div class="option">
        <input type="radio"
               name="duration"
               value="9">
        9 Seconds
      </div>

      <div class="option">
        <input type="radio"
               name="duration"
               value="12">
        12 Seconds
      </div>

    </div>

  </div>


  <!-- VIDEO LENGTH -->
  <div class="card">

    <label>⏱️ Total Video Length</label>

    <select id="videoLength">

      <option value="60">
        1 Minute
      </option>

      <option value="300">
        5 Minutes
      </option>

      <option value="600">
        10 Minutes
      </option>

      <option value="900" selected>
        15 Minutes
      </option>

    </select>

  </div>


  <!-- STYLE -->
  <div class="card">

    <label>🎬 Documentary Style</label>

    <select id="style">

      <option>
        Cinematic Mystery
      </option>

      <option>
        Dark Documentary
      </option>

      <option>
        Historical Documentary
      </option>

      <option>
        Science Documentary
      </option>

      <option>
        Horror Mystery
      </option>

    </select>

  </div>


  <!-- GENERATE -->
  <div class="card">

    <button
      class="generate"
      onclick="generateProject()">

      🚀 Generate Documentary

    </button>

    <div
      id="status"
      class="status">

      Ready

    </div>

    <div class="progress">

      <div
        id="progressBar"
        class="progress-bar">
      </div>

    </div>

  </div>

</div>


<script>

function generateProject(){

  const script =
    document.getElementById("script").value.trim();

  if(!script){

    alert("पहले अपना script डालिए।");

    return;
  }


  const voice =
    document.getElementById("voice").value;


  const duration =
    document.querySelector(
      'input[name="duration"]:checked'
    ).value;


  const videoLength =
    document.getElementById("videoLength").value;


  const style =
    document.getElementById("style").value;


  const totalSeconds =
    parseInt(videoLength);


  const scenes =
    Math.ceil(totalSeconds / parseInt(duration));


  const status =
    document.getElementById("status");

  const progress =
    document.getElementById("progressBar");


  status.innerHTML =
    "⏳ Project तैयार हो रहा है...";


  progress.style.width = "10%";


  setTimeout(()=>{

    progress.style.width = "35%";

    status.innerHTML =
      "🎞️ " + scenes +
      " scenes तैयार किए जाएंगे...";

  },700);


  setTimeout(()=>{

    progress.style.width = "65%";

    status.innerHTML =
      "🎙️ Voice: " + voice;

  },1400);


  setTimeout(()=>{

    progress.style.width = "85%";

    status.innerHTML =
      "🎬 " + style +
      " documentary तैयार हो रही है...";

  },2100);


  setTimeout(()=>{

    progress.style.width = "100%";

    status.innerHTML =
      "✅ Project तैयार है — अगला चरण Video Rendering";

    console.log({

      script:script,

      voice:voice,

      sceneDuration:duration,

      videoLength:videoLength,

      scenes:scenes,

      style:style

    });

  },3000);

}

</script>

</body>
</html>
