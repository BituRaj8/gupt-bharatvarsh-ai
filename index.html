/* =========================
   PIPER INITIALIZATION
========================= */

async function initializePiper(){

  const status =
  document.getElementById("voiceStatus");

  try{

    status.className="status loading";

    status.innerText =
    "⏳ Hindi AI Voice engine तैयार हो रहा है...";

    /*
      Piper locally browser में चलता है।
    */

    engine = new PiperWebEngine();

    status.className="status success";

    status.innerText =
    "✅ Hindi AI Voice तैयार है।";

  }catch(error){

    console.error(error);

    status.className="status error";

    status.innerText =
    "❌ Voice engine शुरू नहीं हो पाया।";

  }

}


/* =========================
   SCENE GENERATOR
========================= */

function generateScenes(){

 const story =
 document.getElementById("story").value.trim();

 if(!story){

   alert("पहले अपनी कहानी लिखो।");
   return;

 }

 const sceneBox =
 document.getElementById("scenes");

 sceneBox.innerHTML = "";

 const sentences =
 story
 .split(/[।!?]\s+/)
 .map(x=>x.trim())
 .filter(x=>x.length>5);

 let list = sentences;

 if(list.length === 0){
   list = [story];
 }


 list.forEach((text,index)=>{

   const prompt =
   "Cinematic documentary scene about: "
   + text
   + ", ultra realistic, dramatic lighting, "
   + "mysterious atmosphere, realistic environment, "
   + "cinematic composition, 16:9, 8K, "
   + "no text, no subtitles, no watermark.";


   const card =
   document.createElement("div");

   card.className="card";


   card.innerHTML=`

   <h3>🎬 Scene ${index+1}</h3>

   <p>${escapeHTML(text)}</p>

   <h4>🖼️ AI Image Prompt</h4>

   <div class="prompt">
   ${escapeHTML(prompt)}
   </div>

   <button onclick="copyPrompt(this)">
   📋 Copy Prompt
   </button>

   `;


   sceneBox.appendChild(card);

 });


 document.getElementById("voiceStatus").innerText =
 "Scenes तैयार हो गए। अब Voice Generate कर सकते हो।";

}
