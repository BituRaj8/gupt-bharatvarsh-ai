<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GUPT BHARATVARSH AI</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
padding:20px;
background:#111;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
margin-bottom:25px;
}

.box{
background:#1b1b1b;
padding:18px;
border-radius:12px;
margin-bottom:20px;
}

textarea,
input,
select{
width:100%;
padding:14px;
font-size:16px;
border:0;
border-radius:10px;
margin:8px 0 15px;
}

textarea{
height:220px;
resize:vertical;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:0;
border-radius:10px;
font-size:17px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
opacity:.5;
}

#generateButton{
background:#457b9d;
color:white;
}

#saveKeyButton{
background:#f4a261;
color:#111;
}

#loadVoices{
background:#8338ec;
color:white;
}

#voiceButton{
background:#e63946;
color:white;
}

#downloadButton{
background:#2a9d8f;
color:white;
}

#removeKeyButton{
background:#555;
color:white;
}

.scene{
background:#222;
padding:15px;
margin:12px 0;
border-radius:10px;
border-left:4px solid #457b9d;
}

.sceneTitle{
color:#ffd166;
font-weight:bold;
font-size:18px;
}

.sceneText{
margin-top:10px;
line-height:1.6;
}

.prompt{
margin-top:12px;
padding:12px;
background:#181818;
border-radius:8px;
color:#bbb;
line-height:1.5;
font-size:14px;
}

#status{
background:#222;
padding:12px;
border-radius:8px;
text-align:center;
margin-top:15px;
}

.note{
color:#999;
font-size:13px;
line-height:1.5;
}

.saved{
color:#90be6d;
font-size:13px;
margin-bottom:10px;
}

audio{
width:100%;
margin-top:15px;
}

</style>
</head>


<body>

<h1>🎬 GUPT BHARATVARSH AI</h1>


<!-- STORY + SCENES -->

<div class="box">

<h2>📝 अपनी Story डालें</h2>

<textarea
id="story"
placeholder="अपनी Hindi documentary story यहाँ लिखें..."
></textarea>


<label>🎬 Number of Scenes</label>

<input
id="sceneCount"
type="number"
min="1"
max="50"
value="10"
>


<button id="generateButton">
🎬 Generate Scenes
</button>


<div id="scenes"></div>

</div>



<!-- ELEVENLABS -->

<div class="box">

<h2>🎙️ ElevenLabs Hindi Voice</h2>


<input
id="apiKey"
type="password"
placeholder="ElevenLabs API Key यहाँ डालें"
>


<div id="keyStatus" class="saved"></div>


<button id="saveKeyButton">
💾 Save API Key
</button>


<button id="removeKeyButton">
🗑️ Remove Saved API Key
</button>


<button id="loadVoices">
🔄 Load ElevenLabs Voices
</button>


<select id="voiceSelect">

<option value="">
पहले Voices Load करें
</option>

</select>


<select id="modelSelect">

<option value="eleven_multilingual_v2">
Multilingual v2 - Natural Hindi
</option>

<option value="eleven_v3">
Eleven v3 - Expressive
</option>

</select>


<label>🎚️ Voice Speed</label>

<input
id="speed"
type="range"
min="0.7"
max="1.2"
step="0.05"
value="0.95"
>

<div id="speedValue">
Speed: 0.95
</div>


<button id="voiceButton">
🎙️ Generate Professional Hindi Voice
</button>


<audio
id="audio"
controls
></audio>


<button
id="downloadButton"
disabled
>
💾 Download MP3
</button>


<div id="status">
🟡 Story डालें और शुरू करें
</div>


<p class="note">
Testing version: API Key browser के local storage में save होती है।
Production version में API Key server पर सुरक्षित रखना चाहिए।
</p>

</div>



<script>

/* =========================
ELEMENTS
========================= */

const story =
document.getElementById("story");

const sceneCount =
document.getElementById("sceneCount");

const generateButton =
document.getElementById("generateButton");

const scenes =
document.getElementById("scenes");

const apiKey =
document.getElementById("apiKey");

const saveKeyButton =
document.getElementById("saveKeyButton");

const removeKeyButton =
document.getElementById("removeKeyButton");

const loadVoices =
document.getElementById("loadVoices");

const voiceSelect =
document.getElementById("voiceSelect");

const voiceButton =
document.getElementById("voiceButton");

const downloadButton =
document.getElementById("downloadButton");

const audio =
document.getElementById("audio");

const status =
document.getElementById("status");

const speed =
document.getElementById("speed");

const speedValue =
document.getElementById("speedValue");

let audioBlob = null;



/* =========================
LOAD SAVED API KEY
========================= */

const savedKey =
localStorage.getItem(
"gb_eleven_api_key"
);

if(savedKey){

apiKey.value =
savedKey;

document.getElementById(
"keyStatus"
).textContent =
"✅ API Key saved है।";

}



/* =========================
LOAD SAVED VOICES
========================= */

const savedVoices =
localStorage.getItem(
"gb_eleven_voices"
);

if(savedVoices){

try{

const voices =
JSON.parse(savedVoices);

voiceSelect.innerHTML = "";

voices.forEach(function(voice){

const option =
document.createElement("option");

option.value =
voice.voice_id;

option.textContent =
voice.name;

voiceSelect.appendChild(option);

});


const savedVoice =
localStorage.getItem(
"gb_selected_voice"
);

if(savedVoice){

voiceSelect.value =
savedVoice;

}

}
catch(error){

console.error(error);

}

}



/* =========================
GENERATE SCENES
========================= */

generateButton.addEventListener(
"click",
function(){

const text =
story.value.trim();

const count =
Number(sceneCount.value);


if(text === ""){

alert("पहले Story लिखें।");

return;

}


if(count < 1 || count > 50){

alert(
"Scenes की संख्या 1 से 50 के बीच रखें।"
);

return;

}


scenes.innerHTML = "";


const words =
text.split(/\s+/).filter(Boolean);


const wordsPerScene =
Math.ceil(
words.length / count
);


let sceneNumber = 0;


for(
let i=0;
i<count;
i++
){

const start =
i * wordsPerScene;

const end =
Math.min(
start + wordsPerScene,
words.length
);


const sceneText =
words
.slice(start,end)
.join(" ");


if(sceneText === ""){
continue;
}


sceneNumber++;


const prompt =
"Cinematic documentary scene, " +
sceneText +
", ultra realistic, dramatic lighting, realistic environment, cinematic composition, high detail, 16:9, 8K, no text, no watermark";


const scene =
document.createElement("div");

scene.className =
"scene";


scene.innerHTML =

"<div class='sceneTitle'>" +
"🎬 Scene " +
sceneNumber +
"</div>" +

"<div class='sceneText'>" +
sceneText +
"</div>" +

"<div class='prompt'>" +
"<b>🖼️ AI Image Prompt:</b><br>" +
prompt +
"</div>";


scenes.appendChild(scene);

}


status.textContent =
"✅ " +
sceneNumber +
" Scenes तैयार हो गए।";

});



/* =========================
SAVE API KEY
========================= */

saveKeyButton.addEventListener(
"click",
function(){

const key =
apiKey.value.trim();


if(!key){

alert(
"पहले API Key डालें।"
);

return;

}


localStorage.setItem(
"gb_eleven_api_key",
key
);


document.getElementById(
"keyStatus"
).textContent =
"✅ API Key save हो गई।";


status.textContent =
"✅ API Key saved है।";

});



/* =========================
REMOVE API KEY
========================= */

removeKeyButton.addEventListener(
"click",
function(){

localStorage.removeItem(
"gb_eleven_api_key"
);

apiKey.value = "";


document.getElementById(
"keyStatus"
).textContent =
"🗑️ API Key हटा दी गई।";


status.textContent =
"🟡 API Key हट गई।";

});



/* =========================
LOAD VOICES
========================= */

loadVoices.addEventListener(
"click",
async function(){

const key =
apiKey.value.trim();


if(!key){

alert(
"पहले ElevenLabs API Key डालें।"
);

return;

}


try{

loadVoices.disabled = true;

status.textContent =
"⏳ Voices load हो रही हैं...";


const response =
await fetch(
"https://api.elevenlabs.io/v1/voices",
{
method:"GET",

headers:{
"xi-api-key":key
}

}
);


if(!response.ok){

const errorText =
await response.text();

console.error(errorText);

throw new Error(
"Voices load नहीं हुईं"
);

}


const data =
await response.json();


localStorage.setItem(
"gb_eleven_api_key",
key
);

localStorage.setItem(
"gb_eleven_voices",
JSON.stringify(
data.voices
)
);


voiceSelect.innerHTML = "";


data.voices.forEach(
function(voice){

const option =
document.createElement("option");

option.value =
voice.voice_id;

option.textContent =
voice.name;

voiceSelect.appendChild(option);

}
);


const savedVoice =
localStorage.getItem(
"gb_selected_voice"
);


if(
savedVoice &&
data.voices.some(
v => v.voice_id === savedVoice
)
){

voiceSelect.value =
savedVoice;

}
else if(data.voices.length){

voiceSelect.value =
data.voices[0].voice_id;

localStorage.setItem(
"gb_selected_voice",
data.voices[0].voice_id
);

}


document.getElementById(
"keyStatus"
).textContent =
"✅ API Key और Voices saved हैं।";


status.textContent =
"✅ Voices successfully load हो गईं।";

}
catch(error){

console.error(error);

status.textContent =
"❌ Voices load नहीं हुईं।";


alert(
"API Key या ElevenLabs account check करें।"
);

}
finally{

loadVoices.disabled = false;

}

});



/* =========================
SAVE VOICE SELECTION
========================= */

voiceSelect.addEventListener(
"change",
function(){

if(voiceSelect.value){

localStorage.setItem(
"gb_selected_voice",
voiceSelect.value
);

}

});



/* =========================
SPEED
========================= */

speed.addEventListener(
"input",
function(){

speedValue.textContent =
"Speed: " +
speed.value;

});



/* =========================
GENERATE VOICE
========================= */

voiceButton.addEventListener(
"click",
async function(){

const key =
apiKey.value.trim();

const text =
story.value.trim();

const voiceId =
voiceSelect.value;

const model =
document.getElementById(
"modelSelect"
).value;

const voiceSpeed =
Number(speed.value);


if(!key){

alert(
"पहले API Key डालें।"
);

return;

}


if(!text){

alert(
"पहले Story लिखें।"
);

return;

}


if(!voiceId){

alert(
"पहले Load ElevenLabs Voices दबाएँ और Voice चुनें।"
);

return;

}


try{

voiceButton.disabled = true;

downloadButton.disabled = true;


status.textContent =
"⏳ Hindi voice बन रही है...";


const url =
"https://api.elevenlabs.io/v1/text-to-speech/" +
voiceId +
"?output_format=mp3_44100_128";


const response =
await fetch(
url,
{
method:"POST",

headers:{
"xi-api-key":key,
"Content-Type":"application/json"
},

body:JSON.stringify({

text:text,

model_id:model,

voice_settings:{
stability:0.45,
similarity_boost:0.80,
style:0.25,
use_speaker_boost:true
},

speed:voiceSpeed

})

}
);


if(!response.ok){

const errorText =
await response.text();

console.error(
"ElevenLabs Error:",
errorText
);

throw new Error(
errorText
);

}


audioBlob =
await response.blob();


const audioURL =
URL.createObjectURL(
audioBlob
);


audio.src =
audioURL;

audio.load();


downloadButton.disabled =
false;


status.textContent =
"✅ Professional Hindi Voice तैयार है!";

}
catch(error){

console.error(error);

status.textContent =
"❌ Voice generate नहीं हुई।";


alert(
"Voice generate नहीं हुई। API Key, Voice और ElevenLabs quota check करें।"
);

}
finally{

voiceButton.disabled =
false;

}

});



/* =========================
DOWNLOAD MP3
========================= */

downloadButton.addEventListener(
"click",
function(){

if(!audioBlob){

return;

}


const url =
URL.createObjectURL(
audioBlob
);


const link =
document.createElement("a");

link.href = url;

link.download =
"gupt-bharatvarsh-hindi-voice.mp3";


document.body.appendChild(link);

link.click();

link.remove();


setTimeout(
function(){

URL.revokeObjectURL(url);

},
1000
);

});

</script>

</body>
</html>
