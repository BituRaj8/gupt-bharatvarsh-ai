<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GUPT BHARATVARSH AI</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 250px;
      box-sizing: border-box;
      padding: 15px;
      font-size: 17px;
      border-radius: 10px;
      border: none;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 6px 0;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #generate {
      background: #e63946;
      color: white;
    }

    #download {
      background: #2a9d8f;
      color: white;
    }

    #download:disabled {
      opacity: 0.5;
    }

    #status {
      margin-top: 15px;
      padding: 12px;
      background: #222;
      border-radius: 8px;
      text-align: center;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }
  </style>
</head>

<body>

<h1>🎬 GUPT BHARATVARSH AI</h1>

<textarea
  id="story"
  placeholder="अपनी हिंदी कहानी यहाँ लिखें..."
></textarea>

<button id="generate">
  🎙️ Generate Hindi AI Voice
</button>

<button id="download" disabled>
  💾 Download WAV
</button>

<div id="status">
  🟡 Voice शुरू करने के लिए Generate दबाएँ
</div>

<audio id="audio" controls></audio>

<script type="module">

import {
  PiperWebWorkerEngine,
  OnnxWebGPUWorkerRuntime,
  HuggingFaceVoiceProvider
} from "piper-tts-web";

let engine = null;
let lastAudio = null;

const status = document.getElementById("status");
const audio = document.getElementById("audio");
const downloadButton = document.getElementById("download");

async function setupVoice() {

  try {

    status.textContent =
      "🔄 Hindi AI Voice तैयार हो रही है...";

    const voiceProvider =
      new HuggingFaceVoiceProvider();

    engine = new PiperWebWorkerEngine({
      onnxRuntime:
        new OnnxWebGPUWorkerRuntime(),

      voiceProvider:
        voiceProvider
    });

    status.textContent =
      "✅ Voice तैयार है — Generate दबाएँ";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Voice engine शुरू नहीं हुआ";
  }
}


async function generateVoice() {

  const text =
    document.getElementById("story").value.trim();

  if (!text) {

    alert("पहले कहानी लिखें।");
    return;
  }

  try {

    if (!engine) {
      await setupVoice();
    }

    status.textContent =
      "⏳ Hindi AI voice बन रही है... पहली बार थोड़ा समय लग सकता है।";

    const response =
      await engine.generate(
        text,
        "hi_IN-pratham-medium",
        0
      );

    lastAudio = response.audio;

    const blob =
      new Blob(
        [lastAudio],
        { type: "audio/wav" }
      );

    const url =
      URL.createObjectURL(blob);

    audio.src = url;

    audio.load();

    await audio.play();

    downloadButton.disabled = false;

    status.textContent =
      "✅ Voice तैयार है";

  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ Voice generate नहीं हुई";

    alert(
      "Voice generate नहीं हुई। पहली बार Hindi voice model download होने में थोड़ा समय लग सकता है।"
    );
  }
}


downloadButton.addEventListener(
  "click",
  function () {

    if (!lastAudio) return;

    const blob =
      new Blob(
        [lastAudio],
        { type: "audio/wav" }
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    a.download =
      "gupt-bharatvarsh-voice.wav";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      () => URL.revokeObjectURL(url),
      1000
    );
  }
);


document
  .getElementById("generate")
  .addEventListener(
    "click",
    generateVoice
  );

setupVoice();

</script>

</body>
</html>
