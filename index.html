<script>

let scenes=[];
let audioBlob=null;
let audioUrl=null;


/* =========================
   ELEMENTS
========================= */

const scriptEl=document.getElementById("script");
const scenesEl=document.getElementById("scenes");
const statusEl=document.getElementById("status");
const voiceStatus=document.getElementById("voiceStatus");
const videoStatus=document.getElementById("videoStatus");

const audioPlayer=document.getElementById("audioPlayer");
const videoPlayer=document.getElementById("videoPlayer");

const canvas=document.getElementById("renderCanvas");
const ctx=canvas.getContext("2d");


/* =========================
   SCENE GENERATION
========================= */

function createScenes(){

  const text=scriptEl.value.trim();

  if(!text){
    alert("Script लिखो");
    return;
  }

  const sentences=text
    .split(/[।!?]+/)
    .map(x=>x.trim())
    .filter(x=>x.length>10);

  scenes=sentences.map((text,index)=>{

    return {
      number:index+1,
      text:text,
      prompt:createPrompt(text,index)
    };

  });

  renderScenes();

}


function createPrompt(text,index){

  const styles={
    mystery:"mysterious ancient Indian temple, dramatic fog, cinematic lighting, dark atmosphere, ultra realistic",
    history:"ancient Indian architecture, historical atmosphere, cinematic documentary lighting, ultra realistic",
    dark:"dark mysterious ancient temple, deep shadows, dramatic cinematic lighting, ultra realistic",
    nature:"ancient stone temple surrounded by natural landscape, cinematic sunlight, ultra realistic"
  };

  const style=document.getElementById("style").value;

  return styles[style]+
  ", scene "+(index+1)+
  ", "+text+
  ", 16:9, no text, no watermark";

}


function renderScenes(){

  scenesEl.innerHTML="";

  scenes.forEach(scene=>{

    const div=document.createElement("div");

    div.className="scene";

    div.innerHTML=`

      <h3>Scene ${scene.number}</h3>

      <p>${escapeHtml(scene.text)}</p>

      <div class="prompt">
      <b>AI Image Prompt:</b><br>
      ${escapeHtml(scene.prompt)}
      </div>

    `;

    scenesEl.appendChild(div);

  });

  statusEl.innerText=
    "✅ "+scenes.length+" scenes generated";

}


function escapeHtml(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


/* =========================
   DOCUMENTARY
========================= */

document.getElementById("generateBtn")
.addEventListener("click",()=>{

  createScenes();

});


/* =========================
   VOICE
========================= */

document.getElementById("voiceBtn")
.addEventListener("click",async()=>{

  const text=scriptEl.value.trim();

  if(!text){
    alert("Script खाली है");
    return;
  }

  voiceStatus.innerText=
    "⏳ ElevenLabs voice generate हो रही है...";

  try{

    const voiceId=
      document.getElementById("voice").value;

    const response=await fetch(
      "/api/generate-voice",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          text:text,
          voiceId:voiceId
        })
      }
    );

    if(!response.ok){

      let errorText="Voice generation failed";

      try{

        const data=await response.json();

        errorText=
          data.details ||
          data.message ||
          data.error ||
          errorText;

      }catch(e){}

      throw new Error(errorText);

    }

    audioBlob=await response.blob();

    audioUrl=URL.createObjectURL(audioBlob);

    audioPlayer.src=audioUrl;

    audioPlayer.load();

    audioPlayer.onloadedmetadata=()=>{

      const duration=
        audioPlayer.duration;

      voiceStatus.innerText=
        "✅ Voice Ready — "+
        formatTime(duration);

    };

  }catch(error){

    console.error(error);

    voiceStatus.innerText=
      "❌ Voice Error: "+
      error.message;

  }

});


/* =========================
   TIME FORMAT
========================= */

function formatTime(seconds){

  if(!isFinite(seconds)){
    return "Unknown";
  }

  const min=Math.floor(seconds/60);

  const sec=Math.floor(seconds%60);

  return min+":"+
    String(sec).padStart(2,"0");

}


/* =========================
   DIFFERENT BACKGROUNDS
========================= */

function drawBackground(sceneIndex,time,mode){

  const w=canvas.width;
  const h=canvas.height;

  /*
    हर scene का अलग visual
  */

  const type=
    sceneIndex % 8;

  /* SKY */

  const sky=ctx.createLinearGradient(
    0,0,0,h
  );

  if(type===0){

    sky.addColorStop(0,"#050518");
    sky.addColorStop(1,"#321f45");

  }

  else if(type===1){

    sky.addColorStop(0,"#071b32");
    sky.addColorStop(1,"#73422b");

  }

  else if(type===2){

    sky.addColorStop(0,"#020202");
    sky.addColorStop(1,"#421313");

  }

  else if(type===3){

    sky.addColorStop(0,"#172e45");
    sky.addColorStop(1,"#b46a37");

  }

  else if(type===4){

    sky.addColorStop(0,"#081018");
    sky.addColorStop(1,"#214b53");

  }

  else if(type===5){

    sky.addColorStop(0,"#190b2b");
    sky.addColorStop(1,"#6d2c58");

  }

  else if(type===6){

    sky.addColorStop(0,"#101010");
    sky.addColorStop(1,"#55502d");

  }

  else{

    sky.addColorStop(0,"#02030a");
    sky.addColorStop(1,"#1f314d");

  }

  ctx.fillStyle=sky;

  ctx.fillRect(0,0,w,h);


  /* MOON */

  const moonX=
    180+(sceneIndex%5)*230;

  const moonY=
    130+(sceneIndex%3)*35;

  ctx.beginPath();

  ctx.arc(
    moonX,
    moonY,
    55,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    "rgba(255,245,190,.9)";

  ctx.shadowBlur=35;

  ctx.shadowColor=
    "rgba(255,240,180,.8)";

  ctx.fill();

  ctx.shadowBlur=0;


  /* STARS */

  for(let i=0;i<90;i++){

    const x=
      (i*137+
      sceneIndex*97)%w;

    const y=
      (i*71+
      sceneIndex*43)%300;

    const size=
      1+(i%3);

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      size,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(255,255,255,"+
      (0.25+(i%5)/10)+")";

    ctx.fill();

  }


  /* MOUNTAINS */

  ctx.beginPath();

  ctx.moveTo(0,h);

  for(let x=0;x<=w;x+=100){

    const peak=
      h-
      170-
      ((x*7+
      sceneIndex*91)%180);

    ctx.lineTo(x,peak);

  }

  ctx.lineTo(w,h);
  ctx.closePath();

  ctx.fillStyle=
    type%2===0 ?
    "#090909" :
    "#14100d";

  ctx.fill();


  /* SECOND MOUNTAIN */

  ctx.beginPath();

  ctx.moveTo(0,h);

  for(let x=0;x<=w;x+=80){

    const peak=
      h-
      90-
      ((x*11+
      sceneIndex*51)%100);

    ctx.lineTo(x,peak);

  }

  ctx.lineTo(w,h);

  ctx.closePath();

  ctx.fillStyle="#050505";

  ctx.fill();


  /* TEMPLE SILHOUETTE */

  const templeX=
    420+
    (sceneIndex%4)*80;

  const templeY=
    390;

  ctx.fillStyle=
    "#080808";

  ctx.fillRect(
    templeX,
    templeY,
    400,
    210
  );


  /* TEMPLE TOWER */

  ctx.beginPath();

  ctx.moveTo(
    templeX+80,
    templeY
  );

  ctx.lineTo(
    templeX+200,
    templeY-180
  );

  ctx.lineTo(
    templeX+320,
    templeY
  );

  ctx.closePath();

  ctx.fill();


  /* COLUMNS */

  for(let i=0;i<6;i++){

    ctx.fillRect(
      templeX+35+i*65,
      templeY+35,
      18,
      175
    );

  }


  /* MOVING LIGHT */

  const lightX=
    (time*0.08+
    sceneIndex*160)%w;

  const glow=
    ctx.createRadialGradient(
      lightX,
      430,
      10,
      lightX,
      430,
      220
    );

  glow.addColorStop(
    0,
    "rgba(255,190,80,.25)"
  );

  glow.addColorStop(
    1,
    "rgba(255,190,80,0)"
  );

  ctx.fillStyle=glow;

  ctx.fillRect(
    0,
    200,
    w,
    400
  );


  /* VIGNETTE */

  const vignette=
    ctx.createRadialGradient(
      w/2,
      h/2,
      150,
      w/2,
      h/2,
      700
    );

  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    1,
    "rgba(0,0,0,.7)"
  );

  ctx.fillStyle=vignette;

  ctx.fillRect(0,0,w,h);

}


/* =========================
   SCENE TEXT
========================= */

function drawSceneText(sceneIndex){

  if(!scenes[sceneIndex]) return;

  const text=
    scenes[sceneIndex].text;

  const w=canvas.width;
  const h=canvas.height;

  ctx.fillStyle=
    "rgba(0,0,0,.48)";

  ctx.fillRect(
    50,
    h-170,
    w-100,
    105
  );

  ctx.fillStyle="#fff";

  ctx.font=
    "bold 27px Arial";

  wrapText(
    text,
    80,
    h-125,
    w-160,
    35
  );

}


function wrapText(
  text,
  x,
  y,
  maxWidth,
  lineHeight
){

  const words=
    text.split(" ");

  let line="";

  for(let n=0;n<words.length;n++){

    const testLine=
      line+
      words[n]+" ";

    const metrics=
      ctx.measureText(testLine);

    if(
      metrics.width>
      maxWidth &&
      n>0
    ){

      ctx.fillText(
        line,
        x,
        y
      );

      line=
        words[n]+" ";

      y+=lineHeight;

    }else{

      line=testLine;

    }

  }

  ctx.fillText(
    line,
    x,
    y
  );

}


/* =========================
   FINAL VIDEO
========================= */

document.getElementById("videoBtn")
.addEventListener("click",async()=>{

  if(!audioBlob || !audioUrl){

    alert(
      "पहले Generate AI Voice करो"
    );

    return;

  }

  if(!scenes.length){

    createScenes();

  }

  if(!scenes.length){

    alert(
      "पहले Documentary generate करो"
    );

    return;

  }


  videoStatus.innerText=
    "⏳ Final video तैयार हो रहा है...";


  try{

    /*
      Audio को पूरा load करो
    */

    const audio=
      new Audio(audioUrl);

    audio.preload="auto";

    await new Promise(
      (resolve,reject)=>{

        audio.onloadedmetadata=
          resolve;

        audio.onerror=
          reject;

      }
    );


    const audioDuration=
      audio.duration;


    /*
      User selected duration
    */

    const requestedDuration=
      Number(
        document.getElementById(
          "totalLength"
        ).value
      );


    /*
      IMPORTANT:

      अगर audio छोटा है,
      video audio से आगे नहीं जाएगा।

      अगर audio बड़ा है,
      requested duration तक चलेगा।

      1 minute test के लिए:
      min(60, audio duration)
    */

    const finalDuration=
      Math.min(
        requestedDuration,
        audioDuration
      );


    const sceneDuration=
      Number(
        document.querySelector(
          'input[name="sceneDuration"]:checked'
        ).value
      );


    const videoType=
      document.querySelector(
        'input[name="videoType"]:checked'
      ).value;


    /*
      Canvas stream
    */

    const canvasStream=
      canvas.captureStream(30);


    /*
      AudioContext
    */

    const AudioContext=
      window.AudioContext ||
      window.webkitAudioContext;

    const audioContext=
      new AudioContext();

    await audioContext.resume();


    const source=
      audioContext.createMediaElementSource(
        audio
      );


    const destination=
      audioContext.createMediaStreamDestination();


    source.connect(destination);

    source.connect(
      audioContext.destination
    );


    /*
      Merge video + audio
    */

    const combinedStream=
      new MediaStream();

    canvasStream
      .getVideoTracks()
      .forEach(track=>{
        combinedStream.addTrack(track);
      });

    destination
      .stream
      .getAudioTracks()
      .forEach(track=>{
        combinedStream.addTrack(track);
      });


    /*
      MediaRecorder
    */

    let mimeType=
      "video/webm;codecs=vp9,opus";

    if(
      !MediaRecorder.isTypeSupported(
        mimeType
      )
    ){

      mimeType=
        "video/webm;codecs=vp8,opus";

    }

    if(
      !MediaRecorder.isTypeSupported(
        mimeType
      )
    ){

      mimeType="video/webm";

    }


    const recorder=
      new MediaRecorder(
        combinedStream,
        {
          mimeType:mimeType,
          videoBitsPerSecond:
            5000000
        }
      );


    const chunks=[];


    recorder.ondataavailable=
      e=>{

        if(e.data.size>0){

          chunks.push(e.data);

        }

      };


    const finished=
      new Promise(resolve=>{

        recorder.onstop=
          resolve;

      });


    recorder.start(1000);


    audio.currentTime=0;

    await audio.play();


    /*
      Render loop
    */

    const start=
      performance.now();


    let lastScene=-1;


    await new Promise(resolve=>{

      function render(){

        const elapsed=
          (performance.now()-
          start)/1000;


        /*
          Scene changes according
          to selected duration
        */

        const sceneIndex=
          Math.floor(
            elapsed/
            sceneDuration
          )%scenes.length;


        /*
          IMPORTANT:

          Background हर scene
          बदलता है
        */

        if(sceneIndex!==lastScene){

          lastScene=
            sceneIndex;

        }


        drawBackground(
          sceneIndex,
          elapsed*1000,
          videoType
        );


        drawSceneText(
          sceneIndex
        );


        videoStatus.innerText=
          "🎬 Rendering: "+
          formatTime(elapsed)+
          " / "+
          formatTime(finalDuration)+
          " — Scene "+
          (sceneIndex+1);


        if(
          elapsed>=finalDuration
        ){

          resolve();
          return;

        }


        requestAnimationFrame(
          render
        );

      }


      render();

    });


    audio.pause();

    recorder.stop();

    await finished;


    /*
      Cleanup
    */

    canvasStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    combinedStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

    source.disconnect();

    audioContext.close();


    /*
      Final blob
    */

    const videoBlob=
      new Blob(
        chunks,
        {
          type:"video/webm"
        }
      );


    const finalUrl=
      URL.createObjectURL(
        videoBlob
      );


    videoPlayer.src=
      finalUrl;

    videoPlayer.load();


    const sizeMB=
