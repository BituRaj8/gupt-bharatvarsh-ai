<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GUPT BHARATVARSH AI</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 padding:15px;
 background:#090909;
 color:#fff;
 font-family:Arial,sans-serif;
}

.container{
 max-width:750px;
 margin:auto;
}

h1{
 text-align:center;
 color:#ff9800;
 font-size:28px;
 margin-bottom:5px;
}

.subtitle{
 text-align:center;
 color:#aaa;
 margin-bottom:20px;
}

.box{
 background:#151515;
 padding:15px;
 border-radius:12px;
 margin-top:18px;
}

textarea{
 width:100%;
 height:190px;
 padding:15px;
 background:#222;
 color:white;
 border:1px solid #555;
 border-radius:10px;
 font-size:16px;
 line-height:1.5;
 resize:vertical;
}

button{
 width:100%;
 padding:14px;
 margin-top:12px;
 background:#ff9800;
 color:#111;
 border:0;
 border-radius:10px;
 font-size:17px;
 font-weight:bold;
}

button:active{
 transform:scale(.98);
}

.secondary{
 background:#333;
 color:white;
}

.card{
 background:#111;
 border:1px solid #333;
 padding:15px;
 border-radius:10px;
 margin-top:15px;
}

.card h3{
 color:#ff9800;
 margin-top:0;
}

.prompt{
 background:#222;
 padding:12px;
 border-radius:8px;
 color:#ddd;
 line-height:1.5;
 word-break:break-word;
}

.status{
 color:#aaa;
 font-size:14px;
 margin-top:10px;
 line-height:1.5;
}

.voiceBox{
 background:#111;
 border:1px solid #333;
 padding:15px;
 border-radius:10px;
 margin-top:15px;
}

select{
 width:100%;
 padding:12px;
 background:#222;
 color:white;
 border:1px solid #555;
 border-radius:8px;
 font-size:16px;
}

audio{
 width:100%;
 margin-top:12px;
}

.small{
 color:#888;
 font-size:13px;
 margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>GUPT BHARATVARSH AI</h1>

<div class="subtitle">
Free AI Documentary Video Maker
</div>

<div class="box">

<h2>📝 Story डालें</h2>

<textarea id="story"
placeholder="अपनी पूरी कहानी यहाँ लिखें...

उदाहरण:
बरमूडा ट्रायंगल दुनिया की सबसे रहस्यमयी जगहों में से एक है..."></textarea>

<button onclick="generateScenes()">
🎬 Generate Scenes
</button>

<button class="secondary" onclick="newProject()">
🆕 New Project
</button>

</div>


<div id="voiceBox" class="voiceBox">

<h2>🎙️ Hindi AI Voice</h2>

<select id="voiceSelect">
<option>Voice load हो रही है...</option>
</select>

<button onclick="generateVoice()">
🔊 Generate Hindi AI Voice
</button>

<button class="secondary" onclick="stopVoice()">
⏹️ Stop Voice
</button>

<div id="voiceStatus" class="status">
Voice तैयार है।
</div>

<audio id="audioPlayer" controls></audio>

<button id="downloadBtn"
class="secondary"
style="display:none"
onclick="downloadAudio()">
⬇️ Download Voice
</button>

<div class="small">
पहली बार browser में उपलब्ध Hindi voice load होने में थोड़ा समय लग सकता है।
</div>

</div>


<div id="scenes"></div>

</div>


<script>

let currentAudioURL = null;
let currentAudioBlob = null;


/* =========================
   SCENE GENERATOR
========================= */

function generateScenes(){

 const story =
 document.getElementById("story").value.trim();

 if(!story){

   alert("पहले अपनी कहानी लिखो।");
   return;

 }

 const sceneBox =
 document.getElementById("scenes");

 sceneBox.innerHTML = "";

 const sentences =
 story
 .split(/[।!?]\s+/)
 .map(x=>x.trim())
 .filter(x=>x.length>5);

 let list = sentences;

 if(list.length === 0){

   list = [story];

 }

 list.forEach((text,index)=>{

   const prompt =
   "Cinematic documentary scene about: "
   + text
   + ", ultra realistic, dramatic lighting, "
   + "mysterious atmosphere, realistic environment, "
   + "cinematic composition, 16:9, 8K, "
   + "no text, no subtitles, no watermark.";

   const card =
   document.createElement("div");

   card.className="card";

   card.innerHTML=`

   <h3>🎬 Scene ${index+1}</h3>

   <p>${escapeHTML(text)}</p>

   <h4>🖼️ AI Image Prompt</h4>

   <div class="prompt">
   ${escapeHTML(prompt)}
   </div>

   <button onclick="copyPrompt(this)">
   📋 Copy Prompt
   </button>

   `;

   sceneBox.appendChild(card);

 });

 document.getElementById("voiceStatus").innerText =
 "Scenes तैयार हो गए। अब Voice Generate कर सकते हो।";

}


/* =========================
   COPY PROMPT
========================= */

function copyPrompt(button){

 const prompt =
 button.previousElementSibling.innerText;

 navigator.clipboard.writeText(prompt)
 .then(()=>{

   button.innerText="✅ Copied";

   setTimeout(()=>{
     button.innerText="📋 Copy Prompt";
   },1500);

 });

}


/* =========================
   SAFE HTML
========================= */

function escapeHTML(text){

 return text
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


/* =========================
   VOICE LOAD
========================= */

function loadVoices(){

 const select =
 document.getElementById("voiceSelect");

 const voices =
 speechSynthesis.getVoices();

 select.innerHTML="";

 const hindiVoices =
 voices.filter(v =>
   v.lang &&
   v.lang.toLowerCase().startsWith("hi")
 );

 const finalVoices =
 hindiVoices.length ? hindiVoices : voices;

 finalVoices.forEach((voice,index)=>{

   const option =
   document.createElement("option");

   option.value=index;

   option.textContent =
   voice.name + " — " + voice.lang;

   select.appendChild(option);

 });

 if(finalVoices.length){

   document.getElementById("voiceStatus").innerText =
   "Hindi voice तैयार है।";

 }else{

   document.getElementById("voiceStatus").innerText =
   "इस browser में voice उपलब्ध नहीं मिली।";

 }

}


speechSynthesis.onvoiceschanged =
loadVoices;

loadVoices();


/* =========================
   GENERATE VOICE
========================= */

function generateVoice(){

 const text =
 document.getElementById("story")
 .value
 .trim();

 if(!text){

   alert("पहले कहानी लिखो।");
   return;

 }

 speechSynthesis.cancel();

 const voices =
 speechSynthesis.getVoices();

 const hindi =
 voices.filter(v =>
   v.lang &&
   v.lang.toLowerCase().startsWith("hi")
 );

 let voice = hindi[0];

 if(!voice){

   alert(
    "इस फोन/browser में Hindi AI voice उपलब्ध नहीं है।"
   );

   return;

 }

 const utterance =
 new SpeechSynthesisUtterance(text);

 utterance.voice=voice;

 utterance.lang="hi-IN";

 /* documentary style */

 utterance.rate=0.88;

 utterance.pitch=0.72;

 utterance.volume=1;

 document.getElementById("voiceStatus").innerText =
 "🎙️ Hindi documentary voice चल रही है...";

 utterance.onend=function(){

   document.getElementById("voiceStatus").innerText =
   "✅ Voice पूरी हो गई।";

 };

 utterance.onerror=function(){

   document.getElementById("voiceStatus").innerText =
   "❌ Voice generate नहीं हो पाई।";

 };

 speechSynthesis.speak(utterance);

}


/* =========================
   STOP
========================= */

function stopVoice(){

 speechSynthesis.cancel();

 document.getElementById("voiceStatus").innerText =
 "⏹️ Voice रोक दी गई।";

}


/* =========================
   NEW PROJECT
========================= */

function newProject(){

 document.getElementById("story").value="";

 document.getElementById("scenes").innerHTML="";

 speechSynthesis.cancel();

 document.getElementById("audioPlayer").src="";

 document.getElementById("downloadBtn")
 .style.display="none";

 document.getElementById("voiceStatus").innerText =
 "नया project शुरू करें।";

}


/* =========================
   DOWNLOAD
========================= */

function downloadAudio(){

 alert(
 "Browser की speechSynthesis voice को WAV file में सीधे download करना सभी phones में संभव नहीं है।"
 );

}

</script>

</body>
</html>
